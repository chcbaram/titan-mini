<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 640" width="780" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <style>
    .t   { font-size: 13px; }
    .b   { font-size: 13.5px; font-weight: 600; }
    .s   { font-size: 11.5px; fill: #6b7280; }
    .m   { font-size: 11.5px; font-family: ui-monospace, Menlo, Consolas, monospace; fill: #6b7280; }
    .ttl { font-size: 15px; font-weight: 700; fill: #374151; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <text x="20" y="26" class="ttl">RA8P1 부팅 시퀀스 — 리셋에서 CPU1 기동까지</text>

  <!-- 리셋 -->
  <rect x="290" y="44" width="200" height="34" rx="17" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="390" y="66" class="b" text-anchor="middle">리셋 해제</text>
  <line x1="390" y1="78" x2="390" y2="100" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- MD 판정 -->
  <path d="M390,102 L520,136 L390,170 L260,136 Z" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="390" y="133" class="b" text-anchor="middle" fill="#b45309">MD = H ?</text>
  <text x="390" y="150" class="s" text-anchor="middle">P201 ← SW2</text>

  <!-- No 분기 -->
  <line x1="260" y1="136" x2="150" y2="136" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="205" y="128" class="s" text-anchor="middle">No</text>
  <rect x="20" y="112" width="128" height="48" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="84" y="133" class="b" text-anchor="middle" fill="#b91c1c">SCI / USB</text>
  <text x="84" y="150" class="b" text-anchor="middle" fill="#b91c1c">Boot Mode</text>

  <!-- Yes -->
  <line x1="390" y1="170" x2="390" y2="192" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="404" y="186" class="s">Yes</text>

  <!-- blank 판정 -->
  <path d="M390,194 L560,232 L390,270 L220,232 Z" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="390" y="226" class="b" text-anchor="middle" fill="#b45309">MRAM 이 비어 있나 ?</text>
  <text x="390" y="243" class="m" text-anchor="middle">0x02000000/04 가 전부 1</text>
  <line x1="220" y1="232" x2="150" y2="180" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="176" y="216" class="s" text-anchor="middle">Yes</text>

  <line x1="390" y1="270" x2="390" y2="294" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="404" y="288" class="s">No</text>

  <!-- Single chip -->
  <rect x="230" y="296" width="320" height="56" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="390" y="318" class="b" text-anchor="middle" fill="#15803d">Single-Chip Mode</text>
  <text x="390" y="337" class="m" text-anchor="middle">SP ← [0x02000000]   PC ← [0x02000004]</text>

  <line x1="390" y1="352" x2="390" y2="376" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- FSP startup -->
  <rect x="150" y="378" width="480" height="132" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="166" y="398" class="b" fill="#1d4ed8">Reset_Handler → SystemInit()</text>
  <text x="166" y="416" class="m">FPU enable · TZ 스택 실링 · SCB-&gt;VTOR</text>
  <text x="166" y="433" class="m">TCM ECC 초기화 (CPU0 만)</text>
  <text x="166" y="450" class="m">bsp_clock_init()  →  WarmStart(POST_CLOCK)</text>
  <text x="166" y="467" class="m">SystemRuntimeInit()  ·  bsp_init_mpu()</text>
  <text x="166" y="486" class="m" fill="#1d4ed8" font-weight="600">WarmStart(POST_C)  →  R_IOPORT_Open()</text>
  <text x="166" y="503" class="s">핀 설정은 main() 진입 전에 이미 끝나 있다</text>

  <line x1="390" y1="510" x2="390" y2="532" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- main -->
  <rect x="150" y="534" width="480" height="84" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="166" y="554" class="b" fill="#6d28d9">main()</text>
  <text x="166" y="573" class="m">bspInit()  →  hal_entry()  →  SysTick_Config(1 ms)</text>
  <text x="166" y="590" class="m">hwInit()   →  ledInit()</text>
  <text x="166" y="607" class="m">apInit()   →  apMain()</text>

  <!-- CPU1 -->
  <rect x="646" y="534" width="118" height="84" rx="5" fill="#fce7f3" stroke="#db2777" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="705" y="556" class="b" text-anchor="middle" fill="#be185d">CPU1</text>
  <text x="705" y="574" class="s" text-anchor="middle">Cortex-M33</text>
  <text x="705" y="590" class="s" text-anchor="middle">정지 상태</text>
  <text x="705" y="606" class="s" text-anchor="middle">23번 단계</text>
  <line x1="630" y1="576" x2="644" y2="576" stroke="#db2777" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#a)"/>

  <!-- 노트 -->
  <rect x="20" y="180" width="128" height="150" rx="5" fill="none" stroke="#d1d5db" stroke-dasharray="4 3"/>
  <text x="30" y="202" class="s" font-weight="600" fill="#4b5563">벽돌이 안 되는</text>
  <text x="30" y="218" class="s" font-weight="600" fill="#4b5563">이유</text>
  <text x="30" y="240" class="s">MRAM 이 지워지면</text>
  <text x="30" y="256" class="s">MD 와 무관하게</text>
  <text x="30" y="272" class="s">부트 모드로 떨어져</text>
  <text x="30" y="288" class="s">복구할 수 있다.</text>
  <text x="30" y="312" class="s">FSBL(OTP)은 기본</text>
  <text x="30" y="328" class="s">Disable 이라 안 낀다.</text>
</svg>
