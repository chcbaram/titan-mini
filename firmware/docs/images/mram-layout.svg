<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 470" width="740" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <style>
    .m   { font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; fill: #6b7280; }
    .b   { font-size: 14px; font-weight: 600; }
    .s   { font-size: 11.5px; fill: #6b7280; }
    .ttl { font-size: 15px; font-weight: 700; fill: #374151; }
    .lbl { font-size: 12px; font-weight: 600; fill: #4b5563; }
  </style>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#db2777"/>
    </marker>
  </defs>

  <text x="20" y="26" class="ttl">MRAM 1 MB 파티션 계획</text>
  <text x="20" y="46" class="s">부트로더 도입 이후의 배치. 현재(20번 단계)는 CPU0 펌웨어가 0x0200_0000 부터 전체를 쓴다.</text>

  <!-- 현재 -->
  <text x="20" y="82" class="lbl">현재 — 20번 단계</text>
  <rect x="20" y="92" width="300" height="52" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="34" y="114" class="b" fill="#15803d">CPU0 펌웨어</text>
  <text x="34" y="133" class="s">1 MB 전체 · 실사용 4,764 B (0.45%)</text>
  <text x="306" y="114" class="m" text-anchor="end">0x0200_0000</text>

  <!-- 화살표 -->
  <text x="360" y="122" class="lbl" text-anchor="middle">→</text>

  <!-- 이후 -->
  <text x="400" y="82" class="lbl">부트로더 도입 이후 — 40번 단계</text>

  <rect x="400" y="92" width="300" height="52" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="414" y="114" class="b" fill="#b91c1c">BOOT   128 KB</text>
  <text x="414" y="133" class="s">RTOS 없음 · TinyUSB CDC + MSC(UF2)</text>
  <text x="686" y="114" class="m" text-anchor="end">0x0200_0000</text>

  <rect x="400" y="150" width="300" height="52" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="414" y="172" class="b" fill="#15803d">CPU0_FW   640 KB</text>
  <text x="414" y="191" class="s">Cortex-M85 · FreeRTOS</text>
  <text x="686" y="172" class="m" text-anchor="end">0x0202_0000</text>

  <rect x="400" y="208" width="300" height="52" rx="5" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="414" y="230" class="b" fill="#be185d">CPU1_FW   256 KB</text>
  <text x="414" y="249" class="s">Cortex-M33 · FreeRTOS</text>
  <text x="686" y="230" class="m" text-anchor="end">0x020C_0000</text>

  <!-- CPU1INITVTOR 지시선 -->
  <line x1="400" y1="272" x2="400" y2="212" stroke="#db2777" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="412" y="278" class="s" fill="#be185d">CPU1INITVTOR 가 이 주소를 가리킨다 — 하위 7비트가 버려지므로 128 B 정렬 필수</text>

  <!-- 제약 -->
  <line x1="20" y1="304" x2="720" y2="304" stroke="#e5e7eb"/>
  <text x="20" y="328" class="lbl">하드웨어 제약</text>
  <text x="20" y="350" class="s">· CPU0 초기 벡터 0x0200_0000 은 고정이다 (Table 2.6). 부트로더가 반드시 맨 앞을 차지한다.</text>
  <text x="20" y="370" class="s">· CPU1INITVTOR[6:0] 은 쓰기가 버려진다 → CPU1 벡터는 128 바이트 정렬 (2.9.1.7).</text>
  <text x="20" y="390" class="s">· MRAM 자체의 파티션 정렬 강제는 없다. 프로그래밍 단위 32 바이트가 사실상 하한.</text>
  <text x="20" y="410" class="s">· Startup area select(8/16/32 KB)를 쓸 거면 그 경계에 맞춘다.</text>
  <text x="20" y="436" class="s">· option_setting_* 섹션(OFS/BPS/SAS/OTP)은 부트로더만 소유한다. 두 이미지가 내보내면 같은 주소에 두 번 쓴다.</text>
  <text x="20" y="458" class="s">· MRAM 은 dual bank / block swap 이 없다. A/B 슬롯은 OSPI0 CS1 의 W25Q64 8 MB 에 둔다.</text>
</svg>
