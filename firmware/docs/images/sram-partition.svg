<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400" width="740" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <style>
    .m   { font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; fill: #6b7280; }
    .b   { font-size: 14px; font-weight: 600; }
    .s   { font-size: 11.5px; fill: #6b7280; }
    .ttl { font-size: 15px; font-weight: 700; fill: #374151; }
    .lbl { font-size: 12px; font-weight: 600; fill: #4b5563; }
  </style>

  <text x="20" y="26" class="ttl">SRAM 1872 KB 분할과 코어별 TCM</text>
  <text x="20" y="46" class="s">FSP 기본은 균등 분할이지만 CPU0 가 LCD·네트워크·파일시스템을 맡으므로 크게 잡는다. 크기는 23번 단계에서 확정.</text>

  <!-- SRAM -->
  <text x="20" y="84" class="lbl">SRAM  0x2200_0000 ~ 0x221D_3FFF   (0x001D_4000 = 1872 KB)</text>

  <rect x="20" y="96" width="380" height="56" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="34" y="120" class="b" fill="#15803d">CPU0 (Cortex-M85)</text>
  <text x="34" y="139" class="s">FreeRTOS 힙 · 드라이버 버퍼 · lwIP 풀</text>
  <text x="386" y="120" class="m" text-anchor="end">0x2200_0000</text>

  <rect x="400" y="96" width="180" height="56" rx="5" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="414" y="120" class="b" fill="#be185d">CPU1 (M33)</text>
  <text x="414" y="139" class="s">FreeRTOS 힙</text>

  <rect x="580" y="96" width="140" height="56" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="594" y="118" class="b" fill="#b45309" font-size="12.5">SHARED</text>
  <text x="594" y="135" class="s">non-cacheable</text>
  <text x="594" y="149" class="s">코어간 IPC 버퍼</text>
  <text x="714" y="120" class="m" text-anchor="end">0x221D_3FFF</text>

  <!-- TCM -->
  <text x="20" y="196" class="lbl">코어 전용 TCM — 두 코어 모두 자기 것을 0x0000_0000 / 0x2000_0000 으로 본다</text>

  <rect x="20" y="208" width="340" height="76" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="34" y="230" class="b" fill="#1d4ed8">CPU0</text>
  <text x="34" y="250" class="m">ITCM  0x0000_0000   128 KB</text>
  <text x="34" y="268" class="m">DTCM  0x2000_0000   128 KB</text>

  <rect x="380" y="208" width="340" height="76" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="394" y="230" class="b" fill="#1d4ed8">CPU1</text>
  <text x="394" y="250" class="m">CTCM  0x0000_0000    64 KB</text>
  <text x="394" y="268" class="m">STCM  0x2000_0000    64 KB</text>

  <line x1="20" y1="308" x2="720" y2="308" stroke="#e5e7eb"/>
  <text x="20" y="332" class="s"><tspan font-weight="600" fill="#4b5563">캐시 주의</tspan> — Cortex-M85 에 D-cache 가 있다. 코어간 공유 버퍼를 캐시 가능 영역에 두면</text>
  <text x="20" y="352" class="s">유지보수(clean/invalidate)를 빼먹는 순간 IPC 가 조용히 깨진다. SHARED 는 MPU 로 non-cacheable 로 잡는다.</text>
  <text x="20" y="378" class="s"><tspan font-weight="600" fill="#4b5563">큰 버퍼</tspan> — LCD 프레임버퍼 · 카메라 · 오디오는 SRAM 이 아니라 SDRAM 32 MB(0x6800_0000)로 보낸다.</text>
</svg>
